syntax = "proto3";

package vega.v1;

option go_package = "github.com/Vega-OSS/vega-ai/packages/proto/vega/v1;vegav1";

// Dummy service to test Envoy gRPC-JSON transcoder
service PingService {
  rpc Ping (PingRequest) returns (PingResponse) {
    // Requires google.api.http options later for transcoding, keeping it simple for now
  }
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string reply = 1;
}
