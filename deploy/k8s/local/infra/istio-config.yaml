apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: default
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: internal-only
  namespace: default
spec:
  # Base deny-all for all pods not explicitly permitted, but we start with an empty spec
  # which means allow all within the mesh via mTLS. For higher security we can scope this.
  action: ALLOW
