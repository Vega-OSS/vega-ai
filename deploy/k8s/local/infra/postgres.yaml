apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: default
data:
  init.sql: |
    CREATE DATABASE vega_controlplane;
    CREATE DATABASE vega_execution;
    CREATE DATABASE vega_scheduler;
    CREATE DATABASE vega_gateway_llm;
    CREATE DATABASE vega_a2a_hub;
    
    \c vega_execution;
    CREATE EXTENSION IF NOT EXISTS vector;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: default
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        # Using a pgvector image for vector search support
        image: pgvector/pgvector:pg17
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          value: "vega_dev_password"
        - name: POSTGRES_USER
          value: "vega_admin"
        - name: POSTGRES_DB
          value: "vega_db"
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/
      volumes:
      - name: init-script
        configMap:
          name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
